name: CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
jobs:
  build:
    runs-on: alva-ci-cpu
    strategy:
      matrix:
        node-version:
        - 18
        - 20
        - 22
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: 'false'
      if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}',
        github.event.repository.default_branch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id
        == github.event.repository.id && github.base_ref == github.event.repository.default_branch) }}
    - name: Checkout repository
      uses: alva-ai/cicd/.github/actions/cached-checkout@main
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}',
        github.event.repository.default_branch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id
        == github.event.repository.id && github.base_ref == github.event.repository.default_branch }}
      with:
        persist-credentials: 'false'
        require-cache: 'true'
        shared-service: 'true'
        ca-cert: ${{ vars.CI_CACHE_SHARED_CA_PEM }}
    - name: Capture package cache identity
      id: arc_cache_identity
      env:
        CACHE_TOOLCHAIN: arc-batch1-72c640b108ddaa33-${{ github.job }}-${{ toJSON(matrix) }}-${{ hashFiles('**/go.mod','**/go.sum','go.work','go.work.sum','**/package-lock.json','uv.lock','pyproject.toml')
          }}
      shell: bash
      run: |
        key=$(printf '%s' "$CACHE_TOOLCHAIN" | sha256sum | cut -d ' ' -f1)
        printf 'toolchain=%s\n' "$key" >> "$GITHUB_OUTPUT"
    - name: Restore authenticated PVC package cache
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}',
        github.event.repository.default_branch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id
        == github.event.repository.id && github.base_ref == github.event.repository.default_branch }}
      uses: alva-ai/cicd/.github/actions/service-build-cache@main
      with:
        operation: restore
        toolchain: ${{ steps.arc_cache_identity.outputs.toolchain }}
        paths: npm
        shared-service: 'true'
        ca-cert: ${{ vars.CI_CACHE_SHARED_CA_PEM }}
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: 'false'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Check formatting
      run: npm run format:check
    - name: Type check
      run: npm run typecheck
    - name: Test
      run: npm test
    - name: Build
      run: npm run build
    - name: Save authenticated PVC package cache
      if: ${{ success() && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}',
        github.event.repository.default_branch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id
        == github.event.repository.id && github.base_ref == github.event.repository.default_branch) }}
      uses: alva-ai/cicd/.github/actions/service-build-cache@main
      with:
        operation: save
        toolchain: ${{ steps.arc_cache_identity.outputs.toolchain }}
        paths: npm
        shared-service: 'true'
        ca-cert: ${{ vars.CI_CACHE_SHARED_CA_PEM }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read
