name: Audit skill registry

# Audits src/resources/skillEndpoints.ts against the live Arrays doc registry.
# On drift, rewrites the endpoint inventory and opens (or updates) a fix PR.

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Built-in token stays read-only; the App performs the branch push, PR and
  # dispatch writes.
  actions: read

concurrency:
  group: audit-skill-registry
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit (--apply)
        id: audit
        run: |
          set +e
          node scripts/audit-skill-registry.mjs --apply > audit-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat audit-report.md

      # The fix branch, the PR and the CI-dispatch fallback are published with
      # an App installation token. A GITHUB_TOKEN push or PR would not trigger
      # the ci.yml checks, which is why the old flow dispatched CI by hand; the
      # App token makes those events fire and can dispatch directly.
      - name: Mint repository write token
        id: app-token
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # Needed for the CI-dispatch fallback below; the App registration and
          # installation must grant Actions write.
          permission-actions: write

      - name: Open or update fix PR
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="audit/skill-registry-drift"
          TITLE="audit: skill registry drift"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/resources/skillEndpoints.ts
          if git diff --cached --quiet; then
            echo "audit reported drift but produced no file diff — bailing"
            exit 1
          fi
          MSG=$(mktemp)
          {
            echo "audit: sync skillEndpoints with Arrays doc registry"
            echo
            echo "Auto-generated by .github/workflows/audit-skill-registry.yml."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$MSG"
          git commit --file "$MSG"

          PUSH_LOG="$RUNNER_TEMP/push.log"
          set +e
          git -c credential.helper='!gh auth git-credential' \
            push --force-with-lease origin "$BRANCH" > "$PUSH_LOG" 2>&1
          PUSH_EXIT=$?
          cat "$PUSH_LOG"
          set -e
          if [ "$PUSH_EXIT" -ne 0 ]; then
            exit "$PUSH_EXIT"
          fi
          PUSH_UPDATED=true
          if grep -q "Everything up-to-date" "$PUSH_LOG"; then
            PUSH_UPDATED=false
          fi

          {
            echo
            echo "---"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> audit-report.md

          NUMBER=$(gh pr list --state open --head "$BRANCH" --json number \
            --jq '.[0].number // empty')
          NEED_CI_DISPATCH=false
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --body-file audit-report.md
            gh pr comment "$NUMBER" --body "Drift still present as of $(date -u +%FT%TZ). Branch force-updated; body refreshed."
            # An updated branch fires pull_request synchronize, which runs CI.
            # A no-op update fires nothing, so keep the dispatch fallback.
            if [ "$PUSH_UPDATED" = false ]; then
              NEED_CI_DISPATCH=true
            fi
          elif gh pr create --title "$TITLE" --body-file audit-report.md \
              --head "$BRANCH" --base main; then
            echo "Opened fix PR on $BRANCH"
          else
            echo "::warning::Could not open PR (org may block Actions from creating PRs). Branch $BRANCH was pushed — open a PR manually."
            NEED_CI_DISPATCH=true
          fi

          # The App token makes the push and PR events trigger CI on their own;
          # workflow_dispatch only covers the cases where no event fires.
          if [ "$NEED_CI_DISPATCH" = true ]; then
            if ! gh workflow run ci.yml --ref "$BRANCH"; then
              echo "::warning::Could not dispatch CI on $BRANCH — run it manually if needed."
            fi
          fi

      - name: Fail if drift
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
